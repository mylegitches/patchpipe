[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpipe"
version = "0.1.0"
description = "Unified AI patch maker for multiple music devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
]

[project.optional-dependencies]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]
dev = []

[project.scripts]
patchpipe = "patchpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchpipe = [
  "hub/**/*",
  "devices/juno_ds/web_assets/*",
  "devices/pod_hd/web_assets/*",
]
